<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JUKO Sessions 2026</title>
<style>
:root{--green:#006b43;--deep:#004d32;--yellow:#ffd400;--black:#111;--white:#f3f3f1;--gray:#d9ddda}
*{box-sizing:border-box}
body{margin:0;background:var(--green);color:#fff;font-family:Arial,Helvetica,sans-serif}
.topline{height:9px;background:linear-gradient(90deg,#171a7a,#7b168f,#171a7a)}
header{padding:0 2.7% 16px}
h1{font-size:clamp(27px,3vw,42px);line-height:1;margin:0 0 8px;font-weight:800;letter-spacing:.2px}
.date{color:var(--yellow);font-weight:800;font-size:14px}
.pill{float:right;margin-top:15px;background:var(--yellow);color:#111;padding:8px 15px;border-radius:22px;font-size:10px;font-weight:800}
.cta{margin:0 2.7% 17px;border:1px solid #43856b;background:var(--deep);border-radius:14px;text-align:center;padding:13px 12px 15px;font-size:12px;font-weight:700}
.cta a{display:inline-block;margin-top:8px;background:var(--yellow);color:#111;text-decoration:none;font-size:13px;font-weight:800;padding:11px 25px;border-radius:9px}
.panel{margin:0 2.7% 25px;background:#111;border:1px solid #5a5a5a;border-radius:15px;padding:13px}
.round{margin-bottom:14px}
.round:last-child{margin-bottom:0}
.round-title{color:var(--yellow);font-size:13px;font-weight:800;margin:2px 0 9px;text-transform:uppercase}
.grid{display:grid;grid-template-columns: minmax(105px,.75fr) minmax(65px,.45fr) repeat(5,minmax(155px,1.25fr));gap:4px;min-width:1000px}
.table-scroll{overflow-x:auto}
.headcell{background:var(--yellow);color:#111;border-radius:9px;padding:12px 7px;text-align:center;font-size:9px;font-weight:800;display:flex;align-items:center;justify-content:center;min-height:36px}
.timecell{background:var(--gray);color:#111;border-radius:9px;padding:12px 7px;text-align:center;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;min-height:58px}
.numbercell{background:#005536;color:white;border:1px solid var(--yellow);border-radius:9px;padding:10px 6px;text-align:center;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px}
.card{background:var(--white);color:#111;border-radius:9px;padding:13px 10px 11px;text-align:center;min-height:58px;display:flex;flex-direction:column;justify-content:center;align-items:center;font-size:11px;line-height:1.35;font-weight:700}
.card .facilitator{font-weight:400;color:#555;font-size:9px;margin-top:7px}
.card .count{display:inline-block;background:var(--yellow);border-radius:20px;padding:5px 10px;margin-top:9px;font-size:9px;font-weight:800}
@media(max-width:700px){header{padding-left:14px;padding-right:14px}.pill{font-size:8px;margin-top:8px}.cta,.panel{margin-left:10px;margin-right:10px}.panel{padding:10px}.grid{grid-template-columns:105px 65px repeat(5,160px)}}
</style>
</head>
<body>
<div class="topline"></div>
<header>
 <span class="pill">INTRO + 3 SESSION ROUNDS</span>
 <h1>JUKO SESSIONS 2026</h1>
 <div class="date">NOVEMBER 19, 2026 · 5:30–8:00 PM</div>
</header>
<div class="cta">
 Students and parents: Select your preferred presentations for JUKO 2026.
 <br><a href="https://bit.ly/JUKOSessions2026" target="_blank" rel="noopener">REGISTER FOR JUKO SESSIONS</a>
</div>
<main class="panel" id="schedule"></main>
<script>
const venues=["FINE ARTS THEATER (FAT)","AMR","LITTLE THEATRE","HS FACULTY LOUNGE","MS FACULTY LOUNGE"];
const rounds=[
 {label:"INTRO · 5:30 PM - 6:00 PM",time:"5:30 PM - 6:00 PM",number:"INTRO",items:[
  ["Counselor Session with Juniors of Mr. Swan and Ms. Lee",""],
  ["Counselor Session with Juniors of Ms. Mayo",""],
  ["Counselor Session with Juniors of Mr. Johnson",""],
  ["Counselor Session with Juniors of Mr. Brooks",""],
  ["Counselor Session with Juniors of Ms. Roth",""]
 ]},
 {label:"SESSION 1 · 6:05 PM - 6:40 PM",time:"6:05 PM - 6:40 PM",number:"1",items:[
  ["Country Specific Admission Process: USA","Mr. Swan"],
  ["Country Specific Admission Process: EUROPE","Ms. Mayo"],
  ["Summer Programs","Mr. Johnson"],
  ["Country Specific Admission Process: CANADA","Mr. Brooks"],
  ["Country Specific Admission Process: AUSTRALIA","Ms. Roth"]
 ]},
 {label:"SESSION 2 · 6:45 PM - 7:20 PM",time:"6:45 PM - 7:20 PM",number:"2",items:[
  ["Oxford and Cambridge Admission Process","Mr. Swan"],
  ["Country Specific Admission Process: UK","Ms. Mayo"],
  ["US Essays","Mr. Johnson"],
  ["Hidden Gems","Mr. Brooks"],
  ["Career Trends and College Majors that Matter","Ms. Roth"]
 ]},
 {label:"SESSION 3 · 7:25 PM - 8:00 PM",time:"7:25 PM - 8:00 PM",number:"3",items:[
  ["The Senior Year: What to Expect, and What You Can Do To Help","Mr. Swan"],
  ["Country Specific Admission Process: UK","Ms. Mayo"],
  ["US Essays","Mr. Johnson"],
  ["Country Specific Admission Process: CANADA","Mr. Brooks"],
  ["Applying to Undegrad Business Programs","Ms. Roth"]
 ]}
];
const root=document.getElementById("schedule");
rounds.forEach(r=>{
 const section=document.createElement("section");section.className="round";
 const title=document.createElement("div");title.className="round-title";title.textContent=r.label;section.appendChild(title);
 const scroll=document.createElement("div");scroll.className="table-scroll";
 const grid=document.createElement("div");grid.className="grid";
 ["TIME","SESSIONS",...venues].forEach(v=>{const h=document.createElement("div");h.className="headcell";h.textContent=v;grid.appendChild(h)});
 const time=document.createElement("div");time.className="timecell";time.textContent=r.time;grid.appendChild(time);
 const num=document.createElement("div");num.className="numbercell";num.textContent=r.number;grid.appendChild(num);
 r.items.forEach(([topic,fac])=>{
  const card=document.createElement("div");card.className="card";
  const t=document.createElement("div");t.textContent=topic;card.appendChild(t);
  if(fac){const f=document.createElement("div");f.className="facilitator";f.textContent="Facilitated by: "+fac;card.appendChild(f)}
  grid.appendChild(card);
 });
 scroll.appendChild(grid);section.appendChild(scroll);root.appendChild(section);
});
</script>
</body></html>
